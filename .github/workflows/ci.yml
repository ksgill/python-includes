name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # The same workflow the tools call, so this repository is held to what it
  # asks of them and the job definitions exist once.
  python:
    uses: ./.github/workflows/python-ci.yml
    with:
      vendor: false
      smoke: |
        ./vendor-sync --help
        python3 -c 'import sys; sys.path.insert(0, "."); from includes import log; log.info("ok")'
