name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  RUFF_VERSION: "0.16.9"
  MYPY_VERSION: "2.4.0"
  PYTEST_VERSION: "9.1.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "ruff==${RUFF_VERSION}" "mypy==${MYPY_VERSION}"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "pytest==${PYTEST_VERSION}"
      - run: pytest -q
      - run: ./vendor-sync --help
